name: sellout

x-service-env: &service-env
  SELLOUT_OIDC_ISSUER: http://localhost:8180/realms/sellout
  SELLOUT_OIDC_AUDIENCE: sellout-api
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/sellout/protocol/openid-connect/certs
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces

x-service-defaults: &service-defaults
  restart: unless-stopped
  profiles: ["full"]
  # Spring's shutdown phase is 20s; Docker's default kill is only 10s.
  stop_grace_period: 30s
  healthcheck:
    test:
      [
        "CMD",
        "java",
        "-Xmx32m",
        "-XX:TieredStopAtLevel=1",
        "-cp",
        "/app/libs/*",
        "dev.sellout.platform.health.HealthCheck",
      ]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 20s
  deploy:
    resources:
      limits:
        memory: 768M

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: sellout
      POSTGRES_USER: sellout
      POSTGRES_PASSWORD: sellout
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sellout -d sellout"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:8.8-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  kafka:
    image: apache/kafka:4.3.1
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes: ["kafkadata:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  schema-registry:
    image: confluentinc/cp-schema-registry:8.2.4
    depends_on:
      kafka: { condition: service_healthy }
    ports: ["8085:8081"]
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/subjects >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports: ["8180:8080"]
    volumes: ["./ops/keycloak:/opt/keycloak/data/import:ro"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  mailpit:
    image: axllent/mailpit:v1.31
    ports: ["8025:8025", "1025:1025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 6

  prometheus:
    image: prom/prometheus:v3.14.0
    ports: ["9090:9090"]
    volumes: ["./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 6

  grafana:
    image: grafana/grafana:13.2.2
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 6

  tempo:
    image: grafana/tempo:3.0.3
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports: ["3200:3200", "4318:4318"]
    volumes:
      - ./ops/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempodata:/var/tempo
    healthcheck:
      # grafana/tempo:3.0.3 is scratch-based: no wget/curl AND no /bin/sh, so
      # CMD-SHELL "exit 0" also fails (exec: "/bin/sh": no such file). Disabled;
      # rely on depends_on ordering elsewhere instead.
      disable: true

  loki:
    image: grafana/loki:3.7.8
    ports: ["3100:3100"]
    healthcheck:
      # grafana/loki:3.7.8 is scratch-based: no wget/curl AND no /bin/sh, so
      # CMD-SHELL "exit 0" also fails (exec: "/bin/sh": no such file). Disabled;
      # rely on depends_on ordering elsewhere instead.
      disable: true

  inventory-service:
    <<: *service-defaults
    image: sellout/inventory-service:local
    ports: ["8081:8080"]
    environment:
      <<: *service-env
      SELLOUT_DB_URL: jdbc:postgresql://postgres:5432/sellout
      SELLOUT_DB_USER: sellout
      SELLOUT_DB_PASSWORD: sellout
      SPRING_PROFILES_ACTIVE: demo
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }

  psp-simulator:
    <<: *service-defaults
    image: sellout/psp-simulator:local
    ports: ["8082:8080"]
    environment:
      <<: *service-env
    depends_on:
      keycloak: { condition: service_healthy }

volumes:
  pgdata:
  kafkadata:
  tempodata:
