org.gradle.caching=true
# Disabled: com.google.cloud.tools.jib's BuildDockerTask reads Task.project at
# execution time, which the configuration cache disallows outright. Setting
# org.gradle.configuration-cache.problems=warn was tried first but still fails
# with a NullPointerException (this.project is null) both when storing and
# when reusing the cache entry, so the cache is turned off build-wide instead.
org.gradle.configuration-cache=false
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

