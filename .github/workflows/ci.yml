name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - name: Quality gates (compile, lint, unit, property, ArchUnit, coverage)
        run: ./gradlew check

      - name: Integration tests (Testcontainers)
        run: ./gradlew integrationTest

      - name: Build images
        run: ./gradlew jibDockerBuild

      - name: Scan inventory-service image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sellout/inventory-service:local
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Scan psp-simulator image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sellout/psp-simulator:local
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/build/reports/tests/**"
