name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Quality gates (compile, lint, unit, property, ArchUnit, coverage)
        run: ./gradlew check

      - name: Restore Testcontainers images
        id: tc-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/testcontainers-images
          key: tc-images-${{ hashFiles('libs/test-fixtures/src/main/java/dev/sellout/testing/containers/SelloutContainers.java') }}

      - name: Load cached Testcontainers images
        if: steps.tc-cache.outputs.cache-hit == 'true'
        run: for f in ~/.cache/testcontainers-images/*.tar; do docker load -i "$f"; done

      - name: Integration tests (Testcontainers)
        run: ./gradlew integrationTest

      - name: Save Testcontainers images
        if: steps.tc-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/testcontainers-images
          docker save postgres:18-alpine -o ~/.cache/testcontainers-images/postgres.tar
          docker save quay.io/keycloak/keycloak:26.7 -o ~/.cache/testcontainers-images/keycloak.tar

      - name: Cache Testcontainers images
        if: steps.tc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/testcontainers-images
          key: ${{ steps.tc-cache.outputs.cache-primary-key }}

      - name: Build images
        run: ./gradlew jibDockerBuild

      - name: Scan inventory-service image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sellout/inventory-service:local
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Scan psp-simulator image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sellout/psp-simulator:local
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: "**/build/reports/tests/**"
