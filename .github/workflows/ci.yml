name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - name: Quality gates (compile, lint, unit, property, ArchUnit, coverage)
        run: ./gradlew check

      - name: Restore Testcontainers images
        id: tc-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/testcontainers-images
          key: tc-images-${{ hashFiles('libs/test-fixtures/src/main/java/dev/sellout/testing/containers/SelloutContainers.java') }}

      - name: Load cached Testcontainers images
        if: steps.tc-cache.outputs.cache-hit == 'true'
        run: for f in ~/.cache/testcontainers-images/*.tar; do docker load -i "$f"; done

      - name: Integration tests (Testcontainers)
        run: ./gradlew integrationTest

      - name: Save Testcontainers images
        if: steps.tc-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/testcontainers-images
          docker save postgres:18-alpine -o ~/.cache/testcontainers-images/postgres.tar
          docker save quay.io/keycloak/keycloak:26.7 -o ~/.cache/testcontainers-images/keycloak.tar

      - name: Cache Testcontainers images
        if: steps.tc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/testcontainers-images
          key: ${{ steps.tc-cache.outputs.cache-primary-key }}

      - name: Build images
        run: ./gradlew jibDockerBuild

      - name: Scan inventory-service image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sellout/inventory-service:local
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Scan psp-simulator image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sellout/psp-simulator:local
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/build/reports/tests/**"
