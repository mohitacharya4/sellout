[versions]
java = "25"
spring-boot = "4.1.1"
testcontainers = "2.0.5"
testcontainers-keycloak = "4.3.1"
archunit = "1.5.0"
jqwik = "1.10.1"
errorprone = "2.50.0"
errorprone-plugin = "5.1.1"
spotless = "8.10.2"
google-java-format = "1.36.1"
checkstyle = "14.1.0"
jib = "3.5.4"
# Overrides Spring Boot 4.1.1's managed Tomcat 11.0.24 (CVE-2026-65182, CVE-2026-65905,
# CVE-2026-68525, all CRITICAL). Drop once a Spring Boot release manages 11.0.25 or later.
tomcat = "11.0.26"

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
errorprone-gradle-plugin = { module = "net.ltgt.gradle:gradle-errorprone-plugin", version.ref = "errorprone-plugin" }
jib-gradle-plugin = { module = "com.google.cloud.tools:jib-gradle-plugin", version.ref = "jib" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
testcontainers-core = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }
testcontainers-kafka = { module = "org.testcontainers:testcontainers-kafka", version.ref = "testcontainers" }
testcontainers-keycloak = { module = "com.github.dasniko:testcontainers-keycloak", version.ref = "testcontainers-keycloak" }
archunit = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
tomcat-embed-core = { module = "org.apache.tomcat.embed:tomcat-embed-core", version.ref = "tomcat" }
tomcat-embed-el = { module = "org.apache.tomcat.embed:tomcat-embed-el", version.ref = "tomcat" }
tomcat-embed-websocket = { module = "org.apache.tomcat.embed:tomcat-embed-websocket", version.ref = "tomcat" }
